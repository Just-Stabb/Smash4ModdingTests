A hitbox with more editable parameters. A normal hitbox has the default settings for these parameters.
Category: Hitboxes
Param: ID = Hitbox slot 0-7 (AttackModule slot [this+0x40] + id*0x84). [values: 0-7; confidence: high]
Param: Part = Hit group: hitboxes of one part share one already-hit list (a victim is hit once per part). [values: 0-3; confidence: high]
Param: Bone = Bone ID the hitbox follows. [values: bone id; confidence: high]
Param: Damage = Damage %. [values: float; confidence: high]
Param: Angle = Launch angle (361 = Sakurai angle). [values: int; confidence: high]
Param: KBG = Knockback growth. [values: int; confidence: high]
Param: FKB = Fixed (weight-based / set) knockback; 0 = off. Same thing as "WBKB". [values: int; confidence: high]
Param: BKB = Base knockback. [values: int; confidence: high]
Param: Size = Radius. [values: float; confidence: high]
Param: X = Offset X from the bone. [values: float; confidence: high]
Param: Y = Offset Y. [values: float; confidence: high]
Param: Z = Offset Z. [values: float; confidence: high]
Param: Effect = Hit attribute (normal 0, slash 2, electric 3, fire 5, ...); drives the hit effect and special reactions (hurt code 0x02C24DF4 branches on 7, 0xE, 0x18). [values: 0,2,5,3,25,21,36,...; confidence: high]
Param: Trip = Trip chance. [values: float; confidence: high]
Param: Hitlag = Hitlag multiplier. [values: float; confidence: high]
Param: SDI = SDI multiplier. [values: float; confidence: high]
Param: Clang = Can clang with other hitboxes (filter flag 0x01). [values: 0/1; confidence: high]
Param: Rebound = Clang causes rebound. [values: 0/1; confidence: high]
Param: ShieldDamage = Extra shield damage. [values: int; confidence: high]
Param: SFXLevel = Hit sound strength (0-3). [values: 0-3; confidence: high]
Param: SFXType = Hit sound kind. [values: int; confidence: high]
Param: Ground/Air = Victim situation mask: 1 ground, 2 air, 3 both. Bit 31 (0x80000000) sets data +0x56, which drops victim class 2 from the accept mask (accept-word bits 3-4 = 1 instead of 3); used by inhales, Bowser/Koopa command grab, Little Mac smashes/dash attack, Greninja Shadow Sneak. [values: 1,2,3 (+0x80000000); confidence: high]
Param: Direct/Indirect = Direct hit (1) vs indirect/projectile (0). [values: 0/1; confidence: high]
Param: Type = Attack region / kind (punch, kick, sword, body, head, object, ...; Ultimate ATTACK_REGION_*). [values: 0-25+; confidence: medium]
Param: HitBits = Target category mask (6 bits; 63 = everything, 31 / 1 / 43 seen). Goes into the collision filter word. [values: 63,31,1,43,2,3; confidence: high]
Param: Unk41 = Unknown flag at data +0x41. Only Shulk Back Slash front-facing hitboxes (FacingRestrict 3, part 0) set it; the back-hit set (FacingRestrict 6, part 1) leaves it 0. No direct reader found in the battle code; likely "don't hit a victim from behind" (lets the back set take that case). [values: 0 (28 uses of 1); confidence: low]
Param: CollisionPart = Victim hurtbox-part mask (4 bits, 15 = all parts); Ultimate collision_part (COLLISION_PART_MASK_ALL). [values: 15 always; confidence: high]
Param: NoScale = Hitbox size/offset not multiplied by the owner's scale (scale argument replaced by 1.0). [values: 0 (never set in vanilla); confidence: medium]
Param: Shieldable = Can hit shields (0 = unblockable, goes through shield). [values: 0/1; confidence: high]
Param: Reflectable = Can be reflected (filter flag 0x08, self type 2). [values: 0/1; confidence: high]
Param: Absorbable = Can be absorbed (filter flag 0x10, self type 4). [values: 0/1; confidence: high]
Param: Rehit = Rehit rate in frames (0 = once). [values: int; confidence: high]
Param: IgnoreInvuln = Flag at data +0x4D (getter 0x02C09090). Only vanilla use: Wii Fit Trainer d-tilt push box; label kept, not verified. [values: 0 (1 use of 1); confidence: low]
Param: HitAllStates = Widens the victim-state accept field (accept word bits 8-10) from 3 to 7, letting the hitbox hit a 3rd target class normal hitboxes skip. Only Jigglypuff's Puff Up FS uses it. [values: 0 (13 uses of 1); confidence: medium]
Param: FacingRestrict = Facing / side check (LR check). 3 most common, 0, 1, 4, 6, 5, 2. Shulk Back Slash: 3 front set, 6 back-hit set. Hitbox (24-param) takes the module default (AttackModule +0x11A). [values: 0-6; confidence: medium]
Param: NoGrabRelease = A hit from the fighter currently holding the victim doesn't count as a release hit (the captured victim's damage check 0x02C233C0 skips hits whose attacker is its link parent and that have this set). Set on every pummel and throw; also on most ledge attacks and many b-airs, where it has no effect. [values: 0/1 (509 uses); confidence: medium]
Param: TeamDamage = Hits teammates (friendly fire). [values: 0/1; confidence: high]
Param: DisableHitlag = No hitstop for this hit. [values: 0/1; confidence: high]
Param: NoGFX = No hit effect graphic. [values: 0/1; confidence: medium]
Param: Flinchless = Victim doesn't flinch (no damage reaction); hurt code 0x02C24DF4 takes a separate path when set. [values: 0/1; confidence: medium]
Param: Shape = Collision shape kind: 0 sphere, 2 capsule (X2/Y2/Z2; X2 = X if no end point is given). Extended_* commands force 2. Shapes are pooled per kind (0x02C108C4 / 0x02C118E4). [values: 0 / 2; confidence: medium]

